name: macOS ARM64 标签构建

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tag-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出标签与完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 检查构建环境
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version

      - name: 测试打包边界与日期逻辑
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_tag_build.py'
          swift test --arch arm64

      - name: 构建并校验 ARM64 安装包
        env:
          DAYORDER_TAG: ${{ github.ref_name }}
        run: python3 scripts/build-tag.py "$DAYORDER_TAG"

      - name: 上传安装包和校验值
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DayOrder-${{ github.ref_name }}-arm64
          path: build/tag-artifacts/${{ github.ref_name }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

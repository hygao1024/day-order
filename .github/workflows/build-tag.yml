name: macOS ARM64 标签构建

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v1.0.0-alpha.06
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DAYORDER_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出标签与完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.DAYORDER_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: 检查构建环境
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version

      - name: 测试打包边界与日期逻辑
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          swift test --arch arm64

      - name: 构建并校验 ARM64 安装包
        run: python3 scripts/build-tag.py "$DAYORDER_TAG"

      - name: 上传安装包和校验值
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DayOrder-${{ env.DAYORDER_TAG }}-arm64
          path: build/tag-artifacts/${{ env.DAYORDER_TAG }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DAYORDER_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出标签发布脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.DAYORDER_TAG }}
          persist-credentials: false

      - name: 下载已验证安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DayOrder-${{ env.DAYORDER_TAG }}-arm64
          path: build/release-assets

      - name: 上传 Release 附件并公开预发布版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py "$DAYORDER_TAG" build/release-assets
